general {
    lock_cmd = hyprlock
    before_sleep_cmd = hyprlock
}

listener {
    timeout = 300        # 5 minutes - lock screen
    on-timeout = hyprlock
}

listener {
    timeout = 600        # 10 minutes - turn off display
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
