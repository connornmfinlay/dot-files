# ── Cyberpunk Samurai — Hyprland Colours ────────────────────
# Paste this into your ~/.config/hypr/hyprland.conf
# (or source it via: source = ~/.config/hypr/theme.conf)
#
# Active border:   #E040FB (neon purple-pink)
# Inactive border: #1A0A2E (dark purple — nearly invisible shadow)
# Shadow colour:   #0D0019 (deepest purple)

general {
    # Border widths
    border_size = 2
    gaps_in     = 5
    gaps_out    = 10

    # Active = neon pink | Inactive = dark purple (fades into wallpaper)
    col.active_border   = rgba(E040FBff) rgba(89CFF0ff) 45deg
    col.inactive_border = rgba(1A0A2Eff)
}

decoration {
    rounding = 8

    # Drop shadow — deep purple so it feels like the wallpaper's dark bg
    shadow {
        enabled      = true
        range        = 20
        render_power = 3
        color        = rgba(0D0019ee)
        color_inactive = rgba(0D0019aa)
    }

    # Subtle blur so dark purple bg bleeds through floating windows
    blur {
        enabled    = true
        size       = 6
        passes     = 3
        new_optimizations = true
    }

    # Active window very slightly brighter
    active_opacity   = 1.0
    inactive_opacity = 0.92
}

# ── Optional: matching animations ────────────────────────────
animations {
    enabled = true

    bezier = samurai, 0.05, 0.9, 0.1, 1.05

    animation = windows,     1, 5,  samurai, slide
    animation = windowsOut,  1, 4,  default, popin 80%
    animation = border,      1, 8,  default
    animation = borderangle, 1, 30, default, loop   # rotates the pink↔blue gradient
    animation = fade,        1, 5,  default
    animation = workspaces,  1, 5,  samurai, slidevert
}
