# EndeavourOS purple/pink
set -g status-style "bg=#1A0A2E,fg=#E8E0F5"
set -g status-left  " #[fg=#7F3FBF,bold]#S #[fg=#6B2FA0]│ "
set -g status-right "#[fg=#6B2FA0]│ #[fg=#7F3FBF]%H:%M #[fg=#6B2FA0]│ #[fg=#E040FB]%Y-%m-%d "

setw -g window-status-format         "#[fg=#6B2FA0] #I:#W "
setw -g window-status-current-format "#[fg=#1A0A2E,bg=#E040FB,bold] #I:#W "

set -g pane-border-style        "fg=#6B2FA0"
set -g pane-active-border-style "fg=#E040FB"

set -g message-style "fg=#1A0A2E,bg=#E040FB,bold"
set -g mode-style    "fg=#1A0A2E,bg=#E040FB"
