# Tmux conf — theme auto-swaps by OS:
#   macOS       → pure black & white
#   EndeavourOS → cyberpunk-samurai purple (matches Hyprland wallpaper)
#   else (Fedora, etc.) → black & white with neon blue accent
# True colour support (kitty handles this fine)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",alacritty:RGB"

# Status bar
set -g status-position bottom
set -g status-left-length 40
set -g status-right-length 40

# Mouse support (scroll, pane select/resize)
set -g mouse on

%if #{==:#(uname),Darwin}
# ── macOS: pure black & white ───────────────────────────────
set -g status-style "bg=#000000,fg=#FFFFFF"
set -g status-left  " #[fg=#FFFFFF,bold]#S #[fg=#808080]│ "
set -g status-right "#[fg=#808080]│ #[fg=#FFFFFF]%H:%M #[fg=#808080]│ #[fg=#FFFFFF]%Y-%m-%d "

# Window list
setw -g window-status-format         "#[fg=#808080] #I:#W "
setw -g window-status-current-format "#[fg=#000000,bg=#FFFFFF,bold] #I:#W "

# Pane borders
set -g pane-border-style        "fg=#808080"
set -g pane-active-border-style "fg=#FFFFFF"

# Messages and prompts
set -g message-style "fg=#000000,bg=#FFFFFF,bold"

# Copy mode / selection
set -g mode-style "fg=#000000,bg=#FFFFFF"

%elif #{==:#(. /etc/os-release 2>/dev/null; echo $ID),endeavouros}
# ── EndeavourOS: cyberpunk-samurai purple ───────────────────
# Light blue: #89CFF0   Dark purple: #1A0A2E   Pink: #E040FB
set -g status-interval 5
set -g status-style "bg=#1A0A2E,fg=#89CFF0"
set -g status-left  "#[bg=#1A0A2E,fg=#E040FB,bold] ⣿ #S #[fg=#89CFF0]│ "
set -g status-right "#[fg=#6B2FA0]│ #[fg=#89CFF0]%H:%M #[fg=#6B2FA0]│ #[fg=#89CFF0]%d %b "

# Windows
setw -g window-status-format         "#[bg=#1A0A2E,fg=#6B2FA0] #I:#W "
setw -g window-status-current-format "#[bg=#0D0019,fg=#89CFF0,bold] #I:#W #[fg=#E040FB]● "
setw -g window-status-separator      ""

# Pane borders
set -g pane-border-style        "fg=#1A0A2E"
set -g pane-active-border-style "fg=#89CFF0"

# Command / message line
set -g message-style "bg=#0D0019,fg=#E040FB,bold"

# Misc quality-of-life (only paired with this theme historically)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0

%else
# ── Linux (Fedora, etc.): black & white with neon blue accent
set -g status-style "bg=#000000,fg=#FFFFFF"
set -g status-left  " #[fg=#3FBFFE,bold]#S #[fg=#808080]│ "
set -g status-right "#[fg=#808080]│ #[fg=#3FBFFE]%H:%M #[fg=#808080]│ #[fg=#FFFFFF]%Y-%m-%d "

# Window list
setw -g window-status-format         "#[fg=#808080] #I:#W "
setw -g window-status-current-format "#[fg=#000000,bg=#3FBFFE,bold] #I:#W "

# Pane borders
set -g pane-border-style        "fg=#808080"
set -g pane-active-border-style "fg=#3FBFFE"

# Messages and prompts
set -g message-style "fg=#000000,bg=#3FBFFE,bold"

# Copy mode / selection
set -g mode-style "fg=#000000,bg=#3FBFFE"
%endif
