# ── Colours ────────────────────────────────────────────────
# Pulled from cyberpunk-samurai wallpaper
# Light blue:    #89CFF0   Dark purple: #1A0A2E   Pink: #E040FB

# True colour support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ── Status bar ──────────────────────────────────────────────
set -g status on
set -g status-position bottom
set -g status-interval 5

# Background / foreground of the whole bar
set -g status-style "bg=#1A0A2E,fg=#89CFF0"

# Left: session name
set -g status-left-length 30
set -g status-left "#[bg=#1A0A2E,fg=#E040FB,bold] ⣿ #S #[fg=#89CFF0]│ "

# Right: date & time
set -g status-right-length 50
set -g status-right "#[fg=#6B2FA0]│ #[fg=#89CFF0]%H:%M #[fg=#6B2FA0]│ #[fg=#89CFF0]%d %b "

# ── Windows ─────────────────────────────────────────────────
set -g window-status-format         "#[bg=#1A0A2E,fg=#6B2FA0] #I:#W "
set -g window-status-current-format "#[bg=#0D0019,fg=#89CFF0,bold] #I:#W #[fg=#E040FB]● "
set -g window-status-separator      ""

# ── Pane borders ────────────────────────────────────────────
set -g pane-border-style        "fg=#1A0A2E"
set -g pane-active-border-style "fg=#89CFF0"

# ── Command / message line ───────────────────────────────────
set -g message-style "bg=#0D0019,fg=#E040FB,bold"

# ── Misc quality-of-life ─────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g mouse on
