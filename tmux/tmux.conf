# Tmux conf — theme auto-swaps by OS:
#   macOS       → pure black & white
#   EndeavourOS → cyberpunk-samurai purple (matches Hyprland wallpaper)
#   else (Fedora, etc.) → black & white with neon blue accent
# True colour support (kitty handles this fine)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",alacritty:RGB"

# Status bar
set -g status-position bottom
set -g status-left-length 40
set -g status-right-length 40

# Mouse support (scroll, pane select/resize)
set -g mouse on

# Vi-style copy mode: Ctrl-b [ enters, hjkl to move, v to start
# selection, y or Enter to yank (also copies to the system clipboard),
# Ctrl-b ] to paste. Mouse drag-select also auto-copies on release.
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection

# OS detection must run synchronously (if-shell blocks on its test),
# unlike the old %if #(uname) form whose async job could still be
# empty on first parse and silently fall through to the else branch.
TMUX_THEME_DIR="$HOME/dot-files/tmux"

if-shell '[ "$(uname)" = "Darwin" ]' {
    source-file "${TMUX_THEME_DIR}/theme-macos.conf"
    bind-key -T copy-mode-vi y          send-keys -X copy-pipe-and-cancel "pbcopy"
    bind-key -T copy-mode-vi Enter      send-keys -X copy-pipe-and-cancel "pbcopy"
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
} {
    if-shell '. /etc/os-release 2>/dev/null; [ "$ID" = "endeavouros" ]' {
        source-file "${TMUX_THEME_DIR}/theme-endeavouros.conf"
        bind-key -T copy-mode-vi y          send-keys -X copy-pipe-and-cancel "wl-copy"
        bind-key -T copy-mode-vi Enter      send-keys -X copy-pipe-and-cancel "wl-copy"
        bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
    } {
        source-file "${TMUX_THEME_DIR}/theme-linux.conf"
        bind-key -T copy-mode-vi y          send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
        bind-key -T copy-mode-vi Enter      send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
        bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
    }
}
