# ── EndeavourOS: cyberpunk-samurai purple ───────────────────
# Light blue: #89CFF0   Dark purple: #1A0A2E   Pink: #E040FB
set -g status-interval 5
set -g status-style "bg=#1A0A2E,fg=#89CFF0"
set -g status-left  "#[bg=#1A0A2E,fg=#E040FB,bold] ⣿ #S #[fg=#89CFF0]│ "
set -g status-right "#[fg=#6B2FA0]│ #[fg=#89CFF0]%H:%M #[fg=#6B2FA0]│ #[fg=#89CFF0]%d %b "

# Windows
setw -g window-status-format         "#[bg=#1A0A2E,fg=#6B2FA0] #I:#W "
setw -g window-status-current-format "#[bg=#0D0019,fg=#89CFF0,bold] #I:#W #[fg=#E040FB]● "
setw -g window-status-separator      ""

# Pane borders
set -g pane-border-style        "fg=#1A0A2E"
set -g pane-active-border-style "fg=#89CFF0"

# Command / message line
set -g message-style "bg=#0D0019,fg=#E040FB,bold"

# Misc quality-of-life (only paired with this theme historically)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
