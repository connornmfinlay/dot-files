# ── Linux (Fedora, etc.): black & white with neon blue accent
set -g status-style "bg=#000000,fg=#FFFFFF"
set -g status-left  " #[fg=#3FBFFE,bold]#S #[fg=#808080]│ "
set -g status-right "#[fg=#808080]│ #[fg=#3FBFFE]%H:%M #[fg=#808080]│ #[fg=#FFFFFF]%Y-%m-%d "

# Window list
setw -g window-status-format         "#[fg=#808080] #I:#W "
setw -g window-status-current-format "#[fg=#000000,bg=#3FBFFE,bold] #I:#W "

# Pane borders
set -g pane-border-style        "fg=#808080"
set -g pane-active-border-style "fg=#3FBFFE"

# Messages and prompts
set -g message-style "fg=#000000,bg=#3FBFFE,bold"

# Copy mode / selection
set -g mode-style "fg=#000000,bg=#3FBFFE"
